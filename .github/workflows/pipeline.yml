name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: CI - Testes Cypress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Subir a loja
        run: |
          npm run serve > servidor.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000; then
              echo "Loja no ar"
              exit 0
            fi
            sleep 1
          done
          echo "O servidor nao subiu"
          cat servidor.log
          exit 1

      - name: Rodar Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config: baseUrl=http://127.0.0.1:3000
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:3000
          ADMIN: ${{ secrets.ADMIN }}
          CLIENTE: ${{ secrets.CLIENTE }}
          SENHA_PADRAO: ${{ secrets.SENHA_PADRAO }}

      - name: Salvar screenshots (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  deploy:
    name: CD - Publicar no GitHub Pages
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar só os arquivos do site
        run: |
          mkdir _site
          cp -r index.html css js "fotos dos produtos" _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
